<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>看图学提问 - QFT Primary Chinese</title>
  <style>
    :root {
      --primary-green: #2ecc71;
      --primary-blue: #3498db;
      --primary-purple: #9b59b6;
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --accent-yellow: #f1c40f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }

    header {
      width: 100%;
      background-color: #ffeaa7;
      border-bottom: 4px solid #fdcb6e;
      padding: 15px;
      text-align: center;
      position: relative;
    }

    h1 { font-size: 1.6rem; color: #d63031; margin-bottom: 5px; }

    /* Button Rules & Fixes */
    button {
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn {
      font-size: 1rem;
      padding: 10px 16px;
      border: 2px solid rgba(0,0,0,0.15);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #ffffff;
      box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .btn-audio { background-color: #fab1a0; border-color: #e17055; }
    
    .teacher-btn { 
      position: absolute; 
      right: 15px; 
      top: 15px; 
      background: #dfe6e9; 
      font-size: 0.85rem; 
      padding: 6px 10px;
    }

    .level-bar {
      display: flex;
      gap: 8px;
      margin: 15px 0;
      width: 95%;
      max-width: 800px;
    }

    .level-btn {
      flex: 1;
      background: #fff;
      color: #636e72;
      border: 2px solid #b2bec3;
      font-weight: bold;
      padding: 8px;
    }

    .level-btn.active {
      background-color: var(--accent-yellow);
      color: #2d3436;
      border-color: #e1b12c;
    }

    main {
      width: 95%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .media-card {
      background: var(--card-bg);
      border: 3px solid #74b9ff;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .stimulus-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 8px;
    }

    .tab-bar { display: flex; gap: 8px; margin-top: 10px; }
    .tab-btn { flex: 1; color: white; font-weight: bold; opacity: 0.75; }
    .tab-btn.active { opacity: 1; border-width: 3px; }

    .tab-observe { background-color: var(--primary-green); }
    .tab-think { background-color: var(--primary-blue); }
    .tab-predict { background-color: var(--primary-purple); }

    .starters-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 15px;
      border: 3px solid #a29bfe;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      min-height: 80px;
    }

    .starter-btn { background-color: #ffeaa7; border: 2px solid #fdcb6e; color: #2d3436; }
    .starter-btn.selected { background-color: #55efc4; border-color: #00b894; }

    .spark-btn { background-color: #ff7675; color: white; width: 100%; }

    .my-questions-container {
      background: #fef0bf;
      border: 3px solid #ffa502;
      border-radius: 16px;
      padding: 15px;
    }

    .question-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    
    .question-card {
      background: white;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid #ddd;
    }

    /* Modal - Zero interference when closed */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    .modal-overlay.open {
      display: flex !important;
    }

    .modal-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.9rem; margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>看图学提问</h1>
    <p style="font-size: 0.9rem;">"看一看，选一选，说一说" 
      <button type="button" class="btn btn-audio" onclick="safeSpeak('看一看，选一选，说一说')">🔊</button>
    </p>
    <button type="button" class="btn teacher-btn" onclick="openTeacherPanel()">⚙️ 教师模式</button>
  </header>

  <div class="level-bar">
    <button type="button" class="btn level-btn active" id="lvl-1" onclick="setLevel(1)">Level 1<br>提示模式</button>
    <button type="button" class="btn level-btn" id="lvl-2" onclick="setLevel(2)">Level 2<br>填空拼句</button>
    <button type="button" class="btn level-btn" id="lvl-3" onclick="setLevel(3)">Level 3<br>语音提问</button>
  </div>

  <main>
    <section class="media-card">
      <img id="stimulus-img" class="stimulus-img" src="https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80" alt="Scene">
      <div class="tab-bar">
        <button type="button" class="btn tab-btn tab-observe active" id="tab-observe" onclick="switchTab('observe')">👀 观察</button>
        <button type="button" class="btn tab-btn tab-think" id="tab-think" onclick="switchTab('think')">🧠 思考</button>
        <button type="button" class="btn tab-btn tab-predict" id="tab-predict" onclick="switchTab('predict')">🔮 推测</button>
      </div>
    </section>

    <section class="starters-container" id="starters-area"></section>
    
    <button type="button" class="btn spark-btn" id="spark-btn" onclick="triggerRandomSpark()">🎲 随机提示 (Random Spark)</button>

    <section class="my-questions-container">
      <h3>我的问题 (My Questions) 
        <button type="button" class="btn btn-audio" onclick="readAllQuestions()">🔊 读出全部</button>
      </h3>
      <div class="question-list" id="question-list"></div>
    </section>
  </main>

  <!-- Modal Container -->
  <div class="modal-overlay" id="teacher-modal">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;">⚙️ 教师设置</h3>
      <div class="form-group">
        <label for="img-url-input">图片 URL:</label>
        <input type="text" id="img-url-input">
      </div>
      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
        <button type="button" class="btn" onclick="closeTeacherPanel()">取消</button>
        <button type="button" class="btn" style="background: #2ecc71; color: white;" onclick="saveTeacherSettings()">保存</button>
      </div>
    </div>
  </div>

  <script>
    var currentLevel = 1;
    var currentTab = 'observe';
    var selectedQuestions = [];

    var dataStore = {
      imgUrl: "https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80",
      starters: {
        observe: ["有什么人？", "有什么东西？", "在哪里？", "在做什么？"],
        think: ["为什么……？", "怎么会这样？", "他可能在想什么？"],
        predict: ["后来会怎样？", "接下来可能发生什么？"]
      }
    };

    // Safe Speech Function - Will NEVER break the app if speech fails
    function safeSpeak(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN';
          window.speechSynthesis.speak(u);
        }
      } catch (err) {
        console.warn("Speech Synthesis warning:", err);
      }
    }

    function setLevel(lvl) {
      currentLevel = lvl;
      document.getElementById('lvl-1').classList.toggle('active', lvl === 1);
      document.getElementById('lvl-2').classList.toggle('active', lvl === 2);
      document.getElementById('lvl-3').classList.toggle('active', lvl === 3);
      renderQuestions();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-observe').classList.toggle('active', tab === 'observe');
      document.getElementById('tab-think').classList.toggle('active', tab === 'think');
      document.getElementById('tab-predict').classList.toggle('active', tab === 'predict');
      renderStarters();
    }

    function renderStarters() {
      var container = document.getElementById('starters-area');
      container.innerHTML = '';
      var list = dataStore.starters[currentTab] || [];

      for (var i = 0; i < list.length; i++) {
        (function(text) {
          var isSelected = false;
          for (var j = 0; j < selectedQuestions.length; j++) {
            if (selectedQuestions[j].text === text) {
              isSelected = true;
              break;
            }
          }

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn starter-btn' + (isSelected ? ' selected' : '');
          btn.innerHTML = text + ' 🔊';
          btn.onclick = function() {
            toggleStarter(text);
          };
          container.appendChild(btn);
        })(list[i]);
      }
    }

    function toggleStarter(text) {
      safeSpeak(text);
      var index = -1;
      for (var i = 0; i < selectedQuestions.length; i++) {
        if (selectedQuestions[i].text === text) {
          index = i;
          break;
        }
      }

      if (index > -1) {
        selectedQuestions.splice(index, 1);
      } else {
        selectedQuestions.push({ id: Date.now(), text: text });
      }

      renderStarters();
      renderQuestions();
    }

    function triggerRandomSpark() {
      var list = dataStore.starters[currentTab];
      if (!list || list.length === 0) return;
      var randText = list[Math.floor(Math.random() * list.length)];
      toggleStarter(randText);
    }

    function renderQuestions() {
      var container = document.getElementById('question-list');
      container.innerHTML = '';

      if (selectedQuestions.length === 0) {
        container.innerHTML = '<p style="text-align:center; font-size:0.9rem; color:#666;">点击上方词卡，添加问题！</p>';
        return;
      }

      for (var i = 0; i < selectedQuestions.length; i++) {
        (function(q) {
          var card = document.createElement('div');
          card.className = 'question-card';
          
          var titleSpan = document.createElement('span');
          titleSpan.innerHTML = '<b>' + q.text + '</b>';
          
          var actionsDiv = document.createElement('div');
          
          var audioBtn = document.createElement('button');
          audioBtn.type = 'button';
          audioBtn.className = 'btn btn-audio';
          audioBtn.innerHTML = '🔊';
          audioBtn.onclick = function() { safeSpeak(q.text); };

          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'btn';
          delBtn.style.backgroundColor = '#ff7675';
          delBtn.style.color = 'white';
          delBtn.innerHTML = '❌';
          delBtn.onclick = function() { removeQuestion(q.id); };

          actionsDiv.appendChild(audioBtn);
          actionsDiv.appendChild(delBtn);

          card.appendChild(titleSpan);
          card.appendChild(actionsDiv);
          container.appendChild(card);
        })(selectedQuestions[i]);
      }
    }

    function removeQuestion(id) {
      var newList = [];
      for (var i = 0; i < selectedQuestions.length; i++) {
        if (selectedQuestions[i].id !== id) {
          newList.push(selectedQuestions[i]);
        }
      }
      selectedQuestions = newList;
      renderStarters();
      renderQuestions();
    }

    function readAllQuestions() {
      if (selectedQuestions.length === 0) return;
      var textArr = [];
      for (var i = 0; i < selectedQuestions.length; i++) {
        textArr.push(selectedQuestions[i].text);
      }
      safeSpeak(textArr.join('。 '));
    }

    function openTeacherPanel() {
      var p = prompt("请输入密码:", "1234");
      if (p === "1234") {
        document.getElementById('img-url-input').value = dataStore.imgUrl;
        document.getElementById('teacher-modal').classList.add('open');
      }
    }

    function closeTeacherPanel() {
      document.getElementById('teacher-modal').classList.remove('open');
    }

    function saveTeacherSettings() {
      var url = document.getElementById('img-url-input').value;
      if (url) {
        dataStore.imgUrl = url;
        document.getElementById('stimulus-img').src = url;
      }
      closeTeacherPanel();
    }

    // Run Initial Setup
    window.onload = function() {
      renderStarters();
      renderQuestions();
    };
  </script>
</body>
</html>
