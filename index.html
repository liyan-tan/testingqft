<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>看图学提问 - Learn Questioning Through Pictures</title>
  <style>
    :root {
      --primary-green: #2ecc71;
      --primary-blue: #3498db;
      --primary-purple: #9b59b6;
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --accent-yellow: #f1c40f;
      --font-size-base: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'KaiTi', '楷体', 'PingFang SC', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-size-base);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* --- Header --- */
    header {
      width: 100%;
      background-color: #ffeaa7;
      border-bottom: 6px solid #fdcb6e;
      padding: 15px;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      color: #d63031;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #2d3436;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* --- Common Utility Classes & Buttons --- */
    .btn {
      font-size: 1.2rem;
      padding: 12px 20px;
      border: 3px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      user-select: none;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .btn-audio {
      background-color: #fab1a0;
      border-color: #e17055;
      padding: 6px 12px;
      font-size: 1rem;
    }

    .teacher-btn {
      position: absolute;
      right: 15px;
      top: 15px;
      background-color: #dfe6e9;
      font-size: 1rem;
    }

    /* --- Level Selector --- */
    .level-bar {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      width: 95%;
      max-width: 800px;
    }

    .level-btn {
      flex: 1;
      background-color: #fff;
      color: #636e72;
      border: 3px solid #b2bec3;
      font-weight: bold;
    }

    .level-btn.active {
      background-color: var(--accent-yellow);
      color: #2d3436;
      border-color: #e1b12c;
    }

    /* --- Main Container Layout --- */
    main {
      width: 95%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Middle Section: Media Display */
    .media-card {
      background: var(--card-bg);
      border: 4px solid #74b9ff;
      border-radius: 25px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 8px 0 #0984e3;
    }

    .stimulus-img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 15px;
      border: 2px solid #dfe6e9;
    }

    /* Category Tabs */
    .tab-bar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .tab-btn {
      flex: 1;
      color: white;
      font-weight: bold;
      opacity: 0.7;
    }

    .tab-btn.active {
      opacity: 1;
      transform: scale(1.03);
    }

    .tab-observe { background-color: var(--primary-green); }
    .tab-think { background-color: var(--primary-blue); }
    .tab-predict { background-color: var(--primary-purple); }

    /* Bottom Section: Question Starters */
    .starters-container {
      background: var(--card-bg);
      border-radius: 25px;
      padding: 15px;
      border: 4px solid #a29bfe;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      min-height: 120px;
    }

    .starter-btn {
      background-color: #ffeaa7;
      border: 3px solid #fdcb6e;
      color: #2d3436;
      font-size: 1.3rem;
    }

    .starter-btn.selected {
      background-color: #55efc4;
      border-color: #00b894;
    }

    .starter-btn.highlight {
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); background-color: #ff7675; color: white; }
    }

    .spark-btn {
      background-color: #ff7675;
      color: white;
      margin-bottom: 10px;
      width: 100%;
    }

    /* "My Questions" Display Section */
    .my-questions-container {
      background: #eccc68;
      border: 4px solid #ffa502;
      border-radius: 25px;
      padding: 15px;
    }

    .my-questions-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: #2f3542;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .question-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .question-card {
      background: white;
      border-radius: 15px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #ced6e0;
      gap: 10px;
    }

    .question-text {
      flex: 1;
      font-size: 1.3rem;
    }

    /* Level 2 Builder Styles */
    .builder-area {
      background: #f1f2f6;
      padding: 10px;
      border-radius: 12px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sentence-slot {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip {
      background: #70a1ff;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chip-bank {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 2px dashed #ccc;
      padding-top: 8px;
    }

    /* Level 3 Voice Styles */
    .mic-btn {
      background-color: #ff4757;
      color: white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      padding: 0;
      font-size: 1.5rem;
    }

    .mic-btn.recording {
      animation: pulse-red 0.8s infinite;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
    }

    /* Teacher Settings Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-content h2 { margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 1rem; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>看图学提问</h1>
    <div class="subtitle">
      <span>"看一看，选一选，说一说"</span>
      <button class="btn btn-audio" onclick="speakText('看一看，选一选，说一说')">🔊</button>
    </div>
    <button class="btn teacher-btn" onclick="openTeacherPanel()">⚙️ 教师模式</button>
  </header>

  <!-- Level Selection Bar -->
  <div class="level-bar">
    <button class="btn level-btn active" id="lvl1-btn" onclick="setLevel(1)">Level 1<br>提示模式</button>
    <button class="btn level-btn" id="lvl2-btn" onclick="setLevel(2)">Level 2<br>填空拼句</button>
    <button class="btn level-btn" id="lvl3-btn" onclick="setLevel(3)">Level 3<br>语音提问</button>
  </div>

  <main>
    <!-- Middle Section: Stimulus Media -->
    <section class="media-card">
      <img id="stimulus-img" class="stimulus-img" src="https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80" alt="Classroom Scene">
      
      <!-- Scaffolded QFT Category Tabs -->
      <div class="tab-bar">
        <button class="btn tab-btn tab-observe active" id="tab-observe" onclick="switchTab('observe')">👀 观察</button>
        <button class="btn tab-btn tab-think" id="tab-think" onclick="switchTab('think')">🧠 思考</button>
        <button class="btn tab-btn tab-predict" id="tab-predict" onclick="switchTab('predict')">🔮 推测</button>
      </div>
    </section>

    <!-- Question Starters Section -->
    <section class="starters-container" id="starters-area">
      <!-- Dynamic Buttons Injected Here -->
    </section>
    
    <button class="btn spark-btn" id="spark-btn" onclick="triggerRandomSpark()">🎲 随机提示 (Random Spark)</button>

    <!-- My Questions Display Section -->
    <section class="my-questions-container">
      <div class="my-questions-title">
        <span>我的问题 (My Questions)</span>
        <button class="btn btn-audio" onclick="readAllQuestions()">🔊 读出全部</button>
      </div>
      <div class="question-list" id="question-list">
        <!-- Injected Cards -->
      </div>
    </section>
  </main>

  <!-- Teacher Settings Modal -->
  <div class="modal" id="teacher-modal">
    <div class="modal-content">
      <h2>⚙️ 教师设置 (Teacher Mode)</h2>
      
      <div class="form-group">
        <label>更新图片 URL (Update Image URL):</label>
        <input type="text" id="img-url-input" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>观察词卡 (Observe Starters - 逗号分隔):</label>
        <textarea id="observe-input" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label>思考词卡 (Think Starters - 逗号分隔):</label>
        <textarea id="think-input" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label>推测词卡 (Predict Starters - 逗号分隔):</label>
        <textarea id="predict-input" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label>Level 2 词汇库 (Custom Word Chips):</label>
        <textarea id="chips-input" rows="2" placeholder="小明,老师,学校,公园,跑步,看书"></textarea>
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="btn" onclick="closeTeacherPanel()">取消</button>
        <button class="btn" style="background: #2ecc71; color: white;" onclick="saveTeacherSettings()">保存设置</button>
      </div>
    </div>
  </div>

  <script>
    /* --- App State --- */
    let currentLevel = 1;
    let currentTab = 'observe';
    let selectedQuestions = []; // Array of Objects: { id, text, type, filledWords: [] }

    // Data Store
    let dataStore = {
      imgUrl: "https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80",
      starters: {
        observe: ["有什么人？", "有什么东西？", "在哪里？", "在做什么？", "什么时候？"],
        think: ["为什么……？", "怎么会这样？", "从哪里可以看出……？", "他可能在想什么？", "他有什么感受？"],
        predict: ["后来会怎样？", "接下来可能发生什么？", "如果你是他……", "你会怎么做？"]
      },
      wordChips: ["小明", "小红", "老师", "学校", "公园", "游乐场", "跑步", "玩游戏", "哭", "笑"]
    };

    /* --- Speech Synthesis (TTS) Helper --- */
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop active playback
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.85; // Slightly slower speed for primary pupils
        window.speechSynthesis.speak(utterance);
      }
    }

    /* --- App Initialization --- */
    window.onload = () => {
      loadLocalStorage();
      renderStarters();
      renderQuestions();
    };

    function loadLocalStorage() {
      const saved = localStorage.getItem('qft_app_data');
      if (saved) {
        dataStore = JSON.parse(saved);
        document.getElementById('stimulus-img').src = dataStore.imgUrl;
      }
    }

    /* --- Level Management --- */
    function setLevel(lvl) {
      currentLevel = lvl;
      document.querySelectorAll('.level-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === lvl);
      });
      document.getElementById('spark-btn').style.display = (lvl === 1) ? 'block' : 'none';
      renderQuestions();
    }

    /* --- Category Tab Switching --- */
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      renderStarters();
    }

    /* --- Render Starters --- */
    function renderStarters() {
      const container = document.getElementById('starters-area');
      container.innerHTML = '';
      const list = dataStore.starters[currentTab] || [];

      list.forEach(text => {
        const isSelected = selectedQuestions.some(q => q.text === text);
        const btn = document.createElement('button');
        btn.className = `btn starter-btn ${isSelected ? 'selected' : ''}`;
        btn.innerHTML = `${text} <span onclick="event.stopPropagation(); speakText('${text}')">🔊</span>`;
        btn.onclick = () => toggleStarter(text);
        container.appendChild(btn);
      });
    }

    /* --- Toggle Question Selection --- */
    function toggleStarter(text) {
      speakText(text);
      const index = selectedQuestions.findIndex(q => q.text === text);
      
      if (index > -1) {
        selectedQuestions.splice(index, 1);
      } else {
        selectedQuestions.push({
          id: Date.now(),
          text: text,
          type: currentTab,
          filledWords: [],
          voiceRecordedText: ''
        });
      }
      renderStarters();
      renderQuestions();
    }

    /* --- Random Spark Feature --- */
    function triggerRandomSpark() {
      const list = dataStore.starters[currentTab];
      if (!list || list.length === 0) return;
      
      const buttons = document.querySelectorAll('.starter-btn');
      const randomIndex = Math.floor(Math.random() * list.length);
      const targetBtn = buttons[randomIndex];

      targetBtn.classList.add('highlight');
      speakText(list[randomIndex]);

      setTimeout(() => {
        targetBtn.classList.remove('highlight');
      }, 1500);
    }

    /* --- Render "My Questions" Section --- */
    function renderQuestions() {
      const container = document.getElementById('question-list');
      container.innerHTML = '';

      if (selectedQuestions.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#636e72; padding:10px; font-size:1rem;">点击上方词卡，添加你的问题！<br>(Tap starters above to build questions!)</div>`;
        return;
      }

      selectedQuestions.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        let contentHtml = `<div class="question-text">`;
        
        // Displays logic based on Level
        if (currentLevel === 1) {
          contentHtml += `<b>${q.text}</b>`;
        } else if (currentLevel === 2) {
          contentHtml += `<b>${q.text}</b>`;
          contentHtml += renderSentenceBuilder(q);
        } else if (currentLevel === 3) {
          contentHtml += `<b>${q.text}</b> <br>`;
          contentHtml += `<span style="color:#0984e3;">${q.voiceRecordedText || '👉 点击右侧麦克风说话...'}</span>`;
        }

        contentHtml += `</div>`;

        // Action Controls
        let actionsHtml = `<div style="display:flex; gap:5px; align-items:center;">
          <button class="btn btn-audio" onclick="speakText('${getSpeakableText(q)}')">🔊</button>`;

        if (currentLevel === 3) {
          actionsHtml += `<button class="btn mic-btn" id="mic-${q.id}" onclick="startSpeechRecognition(${q.id})">🎤</button>`;
        }

        actionsHtml += `<button class="btn" style="background:#ff7675; color:white; padding: 6px 12px; font-size:1rem;" onclick="removeQuestion(${q.id})">❌</button>;
        actionsHtml += `</div>`;

        card.innerHTML = contentHtml + actionsHtml;
        container.appendChild(card);
      });
    }

    function getSpeakableText(q) {
      if (currentLevel === 2 && q.filledWords.length > 0) {
        return `${q.filledWords.join('')}，${q.text}`;
      }
      if (currentLevel === 3 && q.voiceRecordedText) {
        return q.voiceRecordedText;
      }
      return q.text;
    }

    function removeQuestion(id) {
      selectedQuestions = selectedQuestions.filter(q => q.id !== id);
      renderStarters();
      renderQuestions();
    }

    function readAllQuestions() {
      if (selectedQuestions.length === 0) return;
      const fullText = selectedQuestions.map(q => getSpeakableText(q)).join('。 ');
      speakText(fullText);
    }

    /* --- Level 2: Interactive Sentence Builder --- */
    function renderSentenceBuilder(q) {
      let html = `<div class="builder-area">
        <div class="sentence-slot">
          <span>拼句: </span>`;
      
      q.filledWords.forEach((word, wIdx) => {
        html += `<span class="chip" onclick="removeWordChip(${q.id}, ${wIdx})">${word} ✖</span>`;
      });

      html += `<span style="color:#888; font-size:0.9rem;">(点击下面词汇填空)</span>
        </div>
        <div class="chip-bank">`;

      dataStore.wordChips.forEach(chipText => {
        html += `<span class="chip" style="background:#00b894;" onclick="addWordChip(${q.id}, '${chipText}')">+ ${chipText}</span>`;
      });

      html += `</div></div>`;
      return html;
    }

    function addWordChip(qId, word) {
      speakText(word);
      const q = selectedQuestions.find(item => item.id === qId);
      if (q) {
        q.filledWords.push(word);
        renderQuestions();
      }
    }

    function removeWordChip(qId, wordIdx) {
      const q = selectedQuestions.find(item => item.id === qId);
      if (q) {
        q.filledWords.splice(wordIdx, 1);
        renderQuestions();
      }
    }

    /* --- Level 3: Web Speech API STT --- */
    function startSpeechRecognition(qId) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("当前浏览器不支持语音识别，请使用 Chrome 浏览器。(Speech recognition not supported on this browser. Please use Chrome.)");
        return;
      }

      const micBtn = document.getElementById(`mic-${qId}`);
      micBtn.classList.add('recording');

      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.interimResults = false;

      recognition.start();

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const q = selectedQuestions.find(item => item.id === qId);
        if (q) {
          q.voiceRecordedText = transcript;
          renderQuestions();
        }
      };

      recognition.onerror = (e) => {
        console.error("Speech Recognition Error", e);
        micBtn.classList.remove('recording');
      };

      recognition.onend = () => {
        micBtn.classList.remove('recording');
      };
    }

    /* --- Teacher Settings Logic --- */
    function openTeacherPanel() {
      const pass = prompt("请输入教师密码 (Enter Teacher Password):", "1234");
      if (pass !== "1234") {
        alert("密码错误 (Incorrect password)");
        return;
      }

      document.getElementById('img-url-input').value = dataStore.imgUrl;
      document.getElementById('observe-input').value = dataStore.starters.observe.join(',');
      document.getElementById('think-input').value = dataStore.starters.think.join(',');
      document.getElementById('predict-input').value = dataStore.starters.predict.join(',');
      document.getElementById('chips-input').value = dataStore.wordChips.join(',');

      document.getElementById('teacher-modal').style.display = 'flex';
    }

    function closeTeacherPanel() {
      document.getElementById('teacher-modal').style.display = 'none';
    }

    function saveTeacherSettings() {
      const newImg = document.getElementById('img-url-input').value.trim();
      if (newImg) {
        dataStore.imgUrl = newImg;
        document.getElementById('stimulus-img').src = newImg;
      }

      dataStore.starters.observe = document.getElementById('observe-input').value.split(',').map(s => s.trim()).filter(Boolean);
      dataStore.starters.think = document.getElementById('think-input').value.split(',').map(s => s.trim()).filter(Boolean);
      dataStore.starters.predict = document.getElementById('predict-input').value.split(',').map(s => s.trim()).filter(Boolean);
      dataStore.wordChips = document.getElementById('chips-input').value.split(',').map(s => s.trim()).filter(Boolean);

      localStorage.setItem('qft_app_data', JSON.stringify(dataStore));

      renderStarters();
      renderQuestions();
      closeTeacherPanel();
      alert("设置已保存！ (Settings Saved!)");
    }
  </script>
</body>
</html>
